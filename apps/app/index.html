<!doctype html>
<html lang="fr" data-theme="terracotta">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="noindex, nofollow" />

    <!--
      L'application authentifiee n'a pas a etre indexee, et ne doit jamais fuiter
      d'URL vers un site tiers via le referer.
    -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>Espace client - Timora</title>
    <!-- Icones du navigateur. favicon.ico sert les navigateurs qui le demandent
         d'office a la racine ; les PNG servent les autres, aux tailles exactes. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/marque/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/marque/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/marque/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#181310" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Cette application necessite JavaScript. Activez-le dans votre navigateur, puis rechargez la
      page.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
